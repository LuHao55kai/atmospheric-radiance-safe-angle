[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atmospheric-safe-angle"
version = "0.1.0"
description = "Physics-informed atmospheric background-radiance upper-bound model and fast safe-angle query"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/LuHao55kai/atmospheric-radiance-safe-angle"
Issues = "https://github.com/LuHao55kai/atmospheric-radiance-safe-angle/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atmospheric_safe_angle = ["parameters.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
